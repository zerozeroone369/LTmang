services:
  - type: web
    name: mxh-sinh-vien-ltm
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mxh-sinh-vien-db
          property: connectionString

databases:
  - name: mxh-sinh-vien-db
    databaseName: mxh_sinh_vien
    user: mxh_admin
    plan: free
